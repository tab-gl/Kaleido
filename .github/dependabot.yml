version: 2
updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
    groups:
      android-libraries:
        patterns: ["androidx.*", "com.android.*", "org.jetbrains.kotlin*", "io.coil-kt*"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
