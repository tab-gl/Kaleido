name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build signed release APKs
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "No ANDROID_KEYSTORE_BASE64 secret present; the release build will fail on push."
            exit 0
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/kaleido-release.jks"
          echo "KALEIDO_KEYSTORE_PATH=$RUNNER_TEMP/kaleido-release.jks" >> "$GITHUB_ENV"

      - name: Check signing secrets
        if: github.event_name == 'push'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=()
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then missing+=("$name"); fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing repository secrets: ${missing[*]}"
            exit 1
          fi
          # Check the secrets against the keystore before the build, so a wrong value is named clearly.
          if ! keytool -list -keystore "$RUNNER_TEMP/kaleido-release.jks" -storepass "$ANDROID_KEYSTORE_PASSWORD" >/dev/null 2>&1; then
            echo "::error title=Signing secret mismatch::The keystore from ANDROID_KEYSTORE_BASE64 did not open with ANDROID_KEYSTORE_PASSWORD. Re-enter both secrets from the current secrets file."
            exit 1
          fi
          if ! keytool -list -keystore "$RUNNER_TEMP/kaleido-release.jks" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error title=Signing secret mismatch::ANDROID_KEY_ALIAS is not an entry in the keystore (expected: kaleido)."
            exit 1
          fi
          echo "Signing secrets match the keystore. Note: for this keystore type ANDROID_KEY_PASSWORD must equal ANDROID_KEYSTORE_PASSWORD."

      - name: Compile Kotlin (debug, no signing)
        run: |
          set +e
          gradle :app:compileDebugKotlin --no-daemon --stacktrace > compile.log 2>&1
          status=$?
          cat compile.log
          if [ "$status" -ne 0 ]; then
            summary=$(grep -E "^e: |What went wrong|Could not|Execution failed" compile.log | head -40 | tr '\n' '|')
            echo "::error title=Compile errors::${summary:-no e: lines found, see log}"
          fi
          exit "$status"

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Build release APKs (arm64-v8a, armeabi-v7a)
        env:
          KALEIDO_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KALEIDO_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KALEIDO_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KALEIDO_REQUIRE_RELEASE_KEY: ${{ github.event_name == 'push' && 'true' || 'false' }}
        run: |
          set +e
          gradle :app:assembleRelease --no-daemon --stacktrace > release.log 2>&1
          status=$?
          cat release.log
          if [ "$status" -ne 0 ]; then
            summary=$(grep -E "Error:|Warning:|^e: |What went wrong|Could not|Execution failed|Failed to|Keystore|password" release.log | head -40 | tr '\n' '|')
            echo "::error title=Release build errors::${summary:-no matching lines found, see log}"
          fi
          exit "$status"

      - name: Verify APK signatures
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          shopt -s nullglob
          APKS=(app/build/outputs/apk/release/*.apk)
          if [ ${#APKS[@]} -eq 0 ]; then echo "No APKs were produced"; exit 1; fi
          for apk in "${APKS[@]}"; do
            echo "== $apk"
            "$APKSIGNER" verify --print-certs "$apk"
          done

      - name: Stage APKs
        run: |
          mkdir -p dist
          shopt -s nullglob
          for apk in app/build/outputs/apk/release/*.apk; do
            case "$apk" in
              *arm64-v8a*) cp "$apk" dist/kaleido-arm64-v8a.apk ;;
              *armeabi-v7a*) cp "$apk" dist/kaleido-armeabi-v7a.apk ;;
            esac
          done
          ls -l dist
          test -f dist/kaleido-arm64-v8a.apk && test -f dist/kaleido-armeabi-v7a.apk

      # archive: false uploads the bare .apk instead of a zip.
      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@v4
        with:
          name: kaleido-arm64-v8a
          path: dist/kaleido-arm64-v8a.apk
          archive: false
          if-no-files-found: error

      - name: Upload armeabi-v7a APK
        uses: actions/upload-artifact@v4
        with:
          name: kaleido-armeabi-v7a
          path: dist/kaleido-armeabi-v7a.apk
          archive: false
          if-no-files-found: error

      - name: Write SHA-256 checksums
        run: |
          cd dist
          sha256sum kaleido-*.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: kaleido-checksums
          path: dist/SHA256SUMS.txt
          archive: false
          if-no-files-found: error

  verify:
    name: Test and compile (pull requests, no signing secrets)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Unit tests (debug, no signing)
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon
