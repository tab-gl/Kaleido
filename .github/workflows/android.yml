name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build signed release APKs
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "No ANDROID_KEYSTORE_BASE64 secret present; the release build will fail on push."
            exit 0
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/kaleido-release.jks"
          echo "KALEIDO_KEYSTORE_PATH=$RUNNER_TEMP/kaleido-release.jks" >> "$GITHUB_ENV"

      - name: Check signing secrets
        if: github.event_name == 'push'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=()
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then missing+=("$name"); fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing repository secrets: ${missing[*]}"
            exit 1
          fi

      - name: Build release APKs (arm64-v8a, armeabi-v7a)
        env:
          KALEIDO_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KALEIDO_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KALEIDO_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KALEIDO_REQUIRE_RELEASE_KEY: ${{ github.event_name == 'push' && 'true' || 'false' }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Verify APK signatures
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          shopt -s nullglob
          APKS=(app/build/outputs/apk/release/*.apk)
          if [ ${#APKS[@]} -eq 0 ]; then echo "No APKs were produced"; exit 1; fi
          for apk in "${APKS[@]}"; do
            echo "== $apk"
            "$APKSIGNER" verify --print-certs "$apk"
          done

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: kaleido-apks
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
